name: Torch graph

on:
  schedule:
    - cron: '17 3 * * *'      # daily, 03:17 UTC
  workflow_dispatch:           # lets you run it by hand

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        working-directory: torch-graph
        run: npm install

      - name: Build SVG
        working-directory: torch-graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          node fetch.js
          node render.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch-graph/graph.svg
          git diff --staged --quiet || git commit -m "chore: regenerate torch graph"
          git push